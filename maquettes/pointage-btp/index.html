<title>Pointage Chantier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : barre d'app + onglets ; saisie en cartes salarié (mobile d'abord), bureau en tableaux. Accent ambre « signalisation chantier ». */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#e9ecf1; --line:#d4d9e1;
  --fg:#18202b; --muted:#5b6575; --accent:#e8a317; --accent-fg:#1b1405;
  --ink:#1f2d3d; --ink-fg:#f3f4f6;
  --ok:#1f8a4c; --ok-bg:#dff3e7; --warn:#a15c00; --warn-bg:#fdf0d8; --bad:#b42318; --bad-bg:#fde4e1;
  --z1:#7fb3d5; --z2:#5b9bc8; --z3:#3f7fb0; --z4:#2c6391; --z5:#1d4870;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#18202a; --surface-2:#212b37; --line:#2e3a48;
  --fg:#e7ebf0; --muted:#97a3b3; --accent:#f0b43a; --accent-fg:#1b1405;
  --ink:#0b0f14; --ink-fg:#e7ebf0;
  --ok:#5fd394; --ok-bg:#16301f; --warn:#f4b860; --warn-bg:#352611; --bad:#ff8a7a; --bad-bg:#3a1915;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#18202a; --surface-2:#212b37; --line:#2e3a48;
  --fg:#e7ebf0; --muted:#97a3b3; --accent:#f0b43a; --accent-fg:#1b1405;
  --ink:#0b0f14; --ink-fg:#e7ebf0;
  --ok:#5fd394; --ok-bg:#16301f; --warn:#f4b860; --warn-bg:#352611; --bad:#ff8a7a; --bad-bg:#3a1915;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.app{background:var(--ink);color:var(--ink-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 1.45rem/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand i{width:26px;height:26px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--ink) 6px 12px);border-radius:4px;display:block}
.demo{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);padding:2px 8px;border-radius:99px;font-weight:700}
.role{margin-left:auto;display:flex;background:#ffffff14;border-radius:8px;padding:3px}
.role button{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;font-weight:600;font-size:.9rem;color:var(--ink-fg);opacity:.75}
.role button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);opacity:1}
nav.tabs{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--ink-fg);opacity:.7;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.3rem}
.sub{color:var(--muted);margin:2px 0 0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.btn{font:600 .95rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:500 1.5rem var(--mono)}
.kpi span{color:var(--muted);font-size:.85rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.card.absent{opacity:.7}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--muted);flex:none}
.who div{min-width:0} .who strong{display:block} .who small{color:var(--muted)}
.who .pill{margin-left:auto}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row label,.field label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:3px}
.row input{width:100%}
.field select{width:100%}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{flex:1;min-width:130px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--surface);color:var(--fg);font:600 .95rem var(--body)}
.tg .sw{width:38px;height:22px;border-radius:99px;background:var(--surface-2);position:relative;flex:none;border:1px solid var(--line)}
.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.tg[aria-pressed="true"]{border-color:var(--accent)}
.tg[aria-pressed="true"] .sw{background:var(--accent);border-color:var(--accent)}
.tg[aria-pressed="true"] .sw::after{transform:translateX(16px);background:var(--accent-fg)}
.calc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.calc b{color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.zone{display:inline-block;font:700 .78rem var(--mono);padding:2px 7px;border-radius:5px;color:#fff}
.z1{background:var(--z1);color:#0d2233}.z2{background:var(--z2)}.z3{background:var(--z3)}.z4{background:var(--z4)}.z5{background:var(--z5)}.z0{background:var(--surface-2);color:var(--muted)}.zx{background:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zonegrid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:center}
.zonegrid input{width:100%}
.note{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-weight:600}
.banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.warn{background:var(--warn-bg);color:var(--warn)}
.map{width:100%;max-width:100%;aspect-ratio:1/1;background:var(--surface-2);border-radius:10px;display:block}
textarea{width:100%;min-height:160px;font:12px var(--mono);background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px #0004;z-index:9}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font:500 .8rem var(--mono);background:var(--surface-2);color:var(--muted)}
.cal .p{background:var(--ok-bg);color:var(--ok)} .cal .h{visibility:hidden}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.role{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="app">
  <div class="bar">
    <div class="brand"><i></i>Pointage Chantier</div>
    <span class="demo">Maquette</span>
    <div class="role" role="group" aria-label="Profil">
      <button id="r-chef" aria-pressed="true">Chef d'équipe</button>
      <button id="r-bureau" aria-pressed="false">Bureau / Paie</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="view"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== Données de démonstration ===== */
const DEPOT={nom:"Dépôt — Carquefou",lat:47.2975,lon:-1.4917};
const COMMUNES=[
 ["Nantes – Île de Nantes",47.2050,-1.5560],["Saint-Herblain",47.2122,-1.6497],["Thouaré-sur-Loire",47.2669,-1.4400],
 ["Sainte-Luce-sur-Loire",47.2503,-1.4847],["Rezé",47.1833,-1.5500],["Vertou",47.1686,-1.4697],["Ancenis",47.3656,-1.1772],
 ["Clisson",47.0870,-1.2820],["Châteaubriant",47.7172,-1.3761],["Saint-Nazaire",47.2735,-2.2138],["Pornic",47.1150,-2.1030],
 ["Nort-sur-Erdre",47.4386,-1.4986],["Machecoul",46.9939,-1.8214],["Blain",47.4769,-1.7631],["Varades",47.3853,-1.0283],
 ["Cholet",47.0600,-0.8790],["Angers",47.4784,-0.5632],["Guérande",47.3281,-2.4292],["Saint-Philbert-de-Grand-Lieu",47.0367,-1.6408],
 ["Orvault",47.2711,-1.6225],["La Chapelle-sur-Erdre",47.2989,-1.5508],["Sucé-sur-Erdre",47.3439,-1.5283]
];
const SAL=[
 {id:1,nom:"Karim Benali",poste:"Chef d'équipe maçon",equipe:"A"},
 {id:2,nom:"Julien Morel",poste:"Maçon N3",equipe:"A"},
 {id:3,nom:"Thomas Guérin",poste:"Manœuvre",equipe:"A"},
 {id:4,nom:"Sébastien Le Goff",poste:"Coffreur",equipe:"A"},
 {id:5,nom:"Antoine Rivière",poste:"Chef d'équipe VRD",equipe:"B"},
 {id:6,nom:"Mehdi Haddad",poste:"Conducteur d'engins",equipe:"B"},
 {id:7,nom:"Lucas Pineau",poste:"Apprenti maçon",equipe:"B"},
 {id:8,nom:"David Fournier",poste:"Maçon N2",equipe:"B"}
];
const DEF_PARAMS={
 panier:11.20, heuresJour:7,
 zones:[{z:1,min:0,max:10,mt:2.10},{z:2,min:10,max:20,mt:4.35},{z:3,min:20,max:30,mt:6.60},{z:4,min:30,max:40,mt:8.90},{z:5,min:40,max:50,mt:11.15}]
};
const DEF_CHANTIERS=[
 {id:1,nom:"Résidence Les Ormes — 24 logements",commune:"Thouaré-sur-Loire",client:"Nantes Habitat (exemple)"},
 {id:2,nom:"Extension groupe scolaire",commune:"Sucé-sur-Erdre",client:"Mairie (exemple)"},
 {id:3,nom:"Entrepôt logistique — dallage",commune:"Ancenis",client:"Privé (exemple)"},
 {id:4,nom:"Rénovation maison de santé",commune:"Clisson",client:"Communauté de communes (exemple)"},
 {id:5,nom:"Lotissement Le Clos — VRD",commune:"Nort-sur-Erdre",client:"Promoteur (exemple)"},
 {id:6,nom:"Réhabilitation halle",commune:"Varades",client:"Privé (exemple)"},
 {id:7,nom:"Pavillon individuel",commune:"Saint-Nazaire",client:"Particulier (exemple)"}
];
/* Lieux spéciaux : pas de chantier → pas d'indemnité de trajet */
const LIEUX_SPE=[{id:"depot",nom:"Dépôt / atelier"},{id:"abs",nom:"Absent"}];
const MOTIFS=["Congés payés","Maladie","RTT","Intempéries","Formation","Absence non justifiée"];

/* ===== Outils ===== */
const $=s=>document.querySelector(s);
const euro=n=>n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const h2s=h=>{const m=Math.round(h*60);return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dist(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);
 const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function commune(n){const c=COMMUNES.find(c=>c[0]===n);return c?{lat:c[1],lon:c[2]}:DEPOT}
function zoneOf(km){for(const z of S.params.zones){if(km>=z.min&&km<z.max)return z}return null}
function chantierInfo(ch){const km=dist(DEPOT,commune(ch.commune));return{km,zone:zoneOf(km)}}
function zoneTag(z,km){if(km==null)return '<span class="zone z0">—</span>';if(!z)return '<span class="zone zx">GD</span>';return `<span class="zone z${z.z}">Z${z.z}</span>`}
function dureeH(e){if(!e||!e.debut||!e.fin)return 0;const[a,b]=e.debut.split(":").map(Number),[c,d]=e.fin.split(":").map(Number);return Math.max(0,(c*60+d-a*60-b-(+e.pause||0))/60)}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function isWorkday(d){const w=d.getDay();return w!==0&&w!==6}
const FERIES=["2026-11-01","2026-11-11","2026-12-25","2026-08-15","2026-07-14"];

/* ===== État (persistant dans le navigateur) ===== */
const TODAY=new Date(2026,9,12);
const KEY="pointage-demo-v1";
let S;
function seed(){
 const s={params:JSON.parse(JSON.stringify(DEF_PARAMS)),chantiers:JSON.parse(JSON.stringify(DEF_CHANTIERS)),saisies:{},valides:{},verrous:{}};
 let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
 const affect={A:[1,1,1,2,2,3,3,3,4,4],B:[5,5,5,5,6,6,7,7,3,5]};
 for(let d=new Date(2026,8,1);d<=TODAY;d.setDate(d.getDate()+1)){
  if(!isWorkday(d))continue;const k=iso(d);if(k===iso(TODAY))continue;
  const day={};const wk=Math.floor((d.getDate()-1)/3);
  SAL.forEach(p=>{
   const x=rnd();
   if(x<0.04){day[p.id]={lieu:"abs",motif:MOTIFS[Math.floor(rnd()*3)]};return}
   const lieu=x<0.12?"depot":affect[p.equipe][wk%10];
   const fin=rnd()<0.25?"17:30":"16:30";
   day[p.id]={lieu,debut:"07:30",fin,pause:60,panier:lieu!=="depot"&&rnd()>0.05,vehicule:lieu!=="depot"&&rnd()>0.08};
  });
  s.saisies[k]=day;s.valides[k]=true;
 }
 s.verrous["2026-09"]=true;
 return s;
}
function load(){try{const v=localStorage.getItem(KEY);if(v){S=JSON.parse(v);return}}catch(e){}S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ===== Calcul d'une journée ===== */
function calc(e){
 if(!e||e.lieu==="abs")return{h:0,panier:0,trajet:0,zone:null,km:null,present:false};
 const h=dureeH(e);let zone=null,km=null,trajet=0;
 if(e.lieu!=="depot"){const ch=S.chantiers.find(c=>c.id==e.lieu);if(ch){const i=chantierInfo(ch);zone=i.zone;km=i.km;if(e.vehicule&&zone)trajet=zone.mt}}
 return{h,panier:e.panier?S.params.panier:0,trajet,zone,km,present:true};
}

/* ===== Navigation ===== */
let role="chef",tab="saisie",dateSel=iso(TODAY),equipe="A",mois="2026-10",salFiche=1;
const TABS={chef:[["saisie","Saisie du jour"],["semaine","Ma semaine"]],bureau:[["recap","Récap paie"],["validation","Validation"],["chantiers","Chantiers & zones"],["params","Paramètres"]]};
function setRole(r){role=r;tab=TABS[r][0][0];$("#r-chef").setAttribute("aria-pressed",r==="chef");$("#r-bureau").setAttribute("aria-pressed",r==="bureau");render()}
$("#r-chef").onclick=()=>setRole("chef");$("#r-bureau").onclick=()=>setRole("bureau");
function renderTabs(){$("#tabs").innerHTML=TABS[role].map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join("");
 $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function render(){renderTabs();({saisie:vSaisie,semaine:vSemaine,recap:vRecap,validation:vValidation,chantiers:vChantiers,params:vParams})[tab]();}

/* ===== Vue : saisie du jour (chef d'équipe) ===== */
function lieuOptions(sel){
 return `<optgroup label="Chantiers">`+S.chantiers.map(c=>{const i=chantierInfo(c);return`<option value="${c.id}" ${sel==c.id?"selected":""}>${esc(c.nom)} · ${esc(c.commune)} (${i.zone?"Z"+i.zone.z:"GD"})</option>`}).join("")+
 `</optgroup><optgroup label="Autres">`+LIEUX_SPE.map(l=>`<option value="${l.id}" ${sel===l.id?"selected":""}>${l.nom}</option>`).join("")+`</optgroup>`;
}
function vSaisie(){
 const day=S.saisies[dateSel]||(S.saisies[dateSel]={});
 const d=new Date(dateSel+"T12:00");const locked=S.verrous[dateSel.slice(0,7)];const valid=S.valides[dateSel];
 const team=SAL.filter(p=>p.equipe===equipe);
 team.forEach(p=>{if(!day[p.id]){const prev=lastEntry(p.id);day[p.id]={lieu:prev?.lieu&&prev.lieu!=="abs"?prev.lieu:"1",debut:"07:30",fin:"16:30",pause:60,panier:true,vehicule:true}}});
 const ro=locked||valid;
 let tot={h:0,p:0,t:0};
 const cards=team.map(p=>{const e=day[p.id];const c=calc(e);tot.h+=c.h;tot.p+=c.panier;tot.t+=c.trajet;
  const abs=e.lieu==="abs";const dis=ro?"disabled":"";
  return `<article class="card ${abs?"absent":""}" data-id="${p.id}">
   <div class="who"><div class="av">${p.nom.split(" ").map(x=>x[0]).join("").slice(0,2)}</div><div><strong>${esc(p.nom)}</strong><small>${esc(p.poste)}</small></div>
   ${abs?`<span class="pill bad">Absent</span>`:`<span class="pill ok">Présent</span>`}</div>
   <div class="field"><label for="l${p.id}">Lieu de travail</label><select id="l${p.id}" data-k="lieu" ${dis}>${lieuOptions(e.lieu)}</select></div>
   ${abs?`<div class="field"><label for="m${p.id}">Motif</label><select id="m${p.id}" data-k="motif" ${dis}>${MOTIFS.map(m=>`<option ${e.motif===m?"selected":""}>${m}</option>`).join("")}</select></div>`:`
   <div class="row">
    <div><label for="d${p.id}">Arrivée</label><input id="d${p.id}" type="time" data-k="debut" value="${e.debut||""}" ${dis}></div>
    <div><label for="f${p.id}">Départ</label><input id="f${p.id}" type="time" data-k="fin" value="${e.fin||""}" ${dis}></div>
    <div><label for="p${p.id}">Pause (min)</label><input id="p${p.id}" type="number" min="0" step="15" data-k="pause" value="${e.pause??60}" ${dis}></div>
   </div>
   <div class="toggles">
    <button class="tg" data-k="panier" aria-pressed="${!!e.panier}" ${dis}>Panier <span class="sw"></span></button>
    <button class="tg" data-k="vehicule" aria-pressed="${!!e.vehicule}" ${dis} ${e.lieu==="depot"?"disabled":""}>Véhicule entreprise <span class="sw"></span></button>
   </div>
   <div class="calc"><span>Heures <b class="num">${h2s(c.h)}</b></span><span>Distance <b class="num">${c.km!=null?c.km.toFixed(1)+" km":"—"}</b> ${zoneTag(c.zone,c.km)}</span><span>Trajet <b class="num">${euro(c.trajet)}</b></span><span>Panier <b class="num">${euro(c.panier)}</b></span></div>`}
  </article>`}).join("");
 $("#view").innerHTML=`
 <div class="head"><div><h1>Saisie du jour</h1><p class="sub">${d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} · Équipe ${equipe}</p></div>
 <div class="ctrl"><button class="btn ghost" id="prev" aria-label="Jour précédent">‹</button><input type="date" id="date" value="${dateSel}"><button class="btn ghost" id="next" aria-label="Jour suivant">›</button>
 <select id="eq"><option value="A" ${equipe==="A"?"selected":""}>Équipe A — Gros œuvre</option><option value="B" ${equipe==="B"?"selected":""}>Équipe B — VRD</option></select></div></div>
 ${locked?`<div class="banner ok">Mois clôturé par le bureau : la saisie est en lecture seule.</div>`:valid?`<div class="banner ok">Journée envoyée au bureau. <button class="btn" id="reopen">Modifier</button></div>`:!isWorkday(d)?`<div class="banner warn">Week-end : saisie possible en cas de travail exceptionnel.</div>`:""}
 <div class="kpis"><div class="kpi"><b>${team.filter(p=>day[p.id].lieu!=="abs").length}/${team.length}</b><span>présents</span></div>
 <div class="kpi"><b>${h2s(tot.h)}</b><span>heures équipe</span></div><div class="kpi"><b>${euro(tot.p)}</b><span>paniers</span></div><div class="kpi"><b>${euro(tot.t)}</b><span>indemnités trajet</span></div></div>
 ${!ro?`<div class="ctrl" style="margin-bottom:12px"><button class="btn" id="all">Appliquer le chantier de ${esc(team[0].nom.split(" ")[0])} à toute l'équipe</button></div>`:""}
 <div class="cards">${cards}</div>
 ${!ro?`<div class="ctrl" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" id="send">Valider et envoyer au bureau</button></div>`:""}`;
 $("#date").onchange=e=>{dateSel=e.target.value;vSaisie()};
 $("#prev").onclick=()=>shift(-1);$("#next").onclick=()=>shift(1);
 $("#eq").onchange=e=>{equipe=e.target.value;vSaisie()};
 $("#reopen")&&($("#reopen").onclick=()=>{delete S.valides[dateSel];save();vSaisie()});
 $("#all")&&($("#all").onclick=()=>{const l=day[team[0].id].lieu;team.forEach(p=>{if(day[p.id].lieu!=="abs")day[p.id].lieu=l});save();vSaisie();toast("Chantier appliqué à l'équipe")});
 $("#send")&&($("#send").onclick=()=>{S.valides[dateSel]=true;save();vSaisie();toast("Journée envoyée au bureau")});
 document.querySelectorAll(".card").forEach(card=>{const e=day[card.dataset.id];
  card.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;
   if(el.classList.contains("tg"))el.onclick=()=>{e[k]=!e[k];save();vSaisie()};
   else el.onchange=()=>{e[k]=k==="pause"?+el.value:el.value;
    if(k==="lieu"){if(el.value==="depot"){e.vehicule=false;e.panier=false}if(el.value==="abs")e.motif=e.motif||MOTIFS[0];else{e.debut=e.debut||"07:30";e.fin=e.fin||"16:30";if(e.pause==null)e.pause=60}}
    save();vSaisie()}})});
}
function shift(n){const d=new Date(dateSel+"T12:00");d.setDate(d.getDate()+n);dateSel=iso(d);vSaisie()}
function lastEntry(id){const ks=Object.keys(S.saisies).filter(k=>k<dateSel).sort();for(let i=ks.length-1;i>=0;i--){const e=S.saisies[ks[i]][id];if(e)return e}return null}

/* ===== Vue : ma semaine ===== */
function vSemaine(){
 const d=new Date(dateSel+"T12:00");const lun=new Date(d);lun.setDate(d.getDate()-((d.getDay()+6)%7));
 const jours=[...Array(5)].map((_,i)=>{const x=new Date(lun);x.setDate(lun.getDate()+i);return iso(x)});
 const team=SAL.filter(p=>p.equipe===equipe);
 const rows=team.map(p=>{let H=0,P=0,T=0;const cells=jours.map(k=>{const e=S.saisies[k]?.[p.id];const c=calc(e);H+=c.h;P+=c.panier?1:0;T+=c.trajet;
   if(!e)return`<td class="r" style="color:var(--muted)">—</td>`;if(e.lieu==="abs")return`<td class="r"><span class="pill bad">${esc(e.motif||"Abs.")}</span></td>`;
   return`<td class="r num">${h2s(c.h)} ${zoneTag(c.zone,c.km)}${c.panier?" 🍽":""}</td>`}).join("");
  return`<tr><td>${esc(p.nom)}</td>${cells}<td class="r num">${h2s(H)}</td><td class="r num">${P}</td><td class="r num">${euro(T)}</td></tr>`}).join("");
 $("#view").innerHTML=`<div class="head"><div><h1>Ma semaine</h1><p class="sub">Semaine du ${lun.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})} · Équipe ${equipe}</p></div>
 <div class="ctrl"><input type="date" id="date" value="${dateSel}"><select id="eq"><option value="A" ${equipe==="A"?"selected":""}>Équipe A</option><option value="B" ${equipe==="B"?"selected":""}>Équipe B</option></select></div></div>
 <div class="tablewrap"><table><thead><tr><th>Salarié</th>${jours.map(k=>`<th class="r">${new Date(k+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"})}</th>`).join("")}<th class="r">Heures</th><th class="r">Paniers</th><th class="r">Trajet</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="note">Chaque case indique les heures, la zone de trajet et 🍽 quand le panier est dû.</p>`;
 $("#date").onchange=e=>{dateSel=e.target.value;vSemaine()};$("#eq").onchange=e=>{equipe=e.target.value;vSemaine()};
}

/* ===== Récap mensuel ===== */
function recap(m){
 const ks=Object.keys(S.saisies).filter(k=>k.startsWith(m)).sort();
 return SAL.map(p=>{const r={p,jours:0,h:0,hs:0,paniers:0,mtP:0,zones:[0,0,0,0,0,0],mtT:0,abs:{}};const sem={};
  ks.forEach(k=>{const e=S.saisies[k][p.id];if(!e)return;if(e.lieu==="abs"){r.abs[e.motif]=(r.abs[e.motif]||0)+1;return}
   const c=calc(e);r.jours++;r.h+=c.h;if(c.panier){r.paniers++;r.mtP+=c.panier}if(c.trajet){r.zones[c.zone.z]++;r.mtT+=c.trajet}
   const d=new Date(k+"T12:00");const w=iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)));sem[w]=(sem[w]||0)+c.h});
  r.hs=Object.values(sem).reduce((a,h)=>a+Math.max(0,h-35),0);return r});
}
function moisSelect(){const ms=[...new Set(Object.keys(S.saisies).map(k=>k.slice(0,7)))].sort();
 return`<select id="mois">${ms.map(m=>`<option value="${m}" ${m===mois?"selected":""}>${new Date(m+"-15").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</option>`).join("")}</select>`}
function vRecap(){
 const R=recap(mois);const T=R.reduce((a,r)=>({h:a.h+r.h,hs:a.hs+r.hs,p:a.p+r.paniers,mp:a.mp+r.mtP,mt:a.mt+r.mtT,z:a.z.map((v,i)=>v+r.zones[i])}),{h:0,hs:0,p:0,mp:0,mt:0,z:[0,0,0,0,0,0]});
 const locked=S.verrous[mois];
 $("#view").innerHTML=`<div class="head"><div><h1>Récapitulatif paie</h1><p class="sub">Synthèse par salarié, prête à transmettre au cabinet ou au logiciel de paie</p></div>
 <div class="ctrl">${moisSelect()}<button class="btn" id="csv">Export CSV paie</button><button class="btn primary" id="lock">${locked?"Rouvrir le mois":"Clôturer le mois"}</button></div></div>
 ${locked?`<div class="banner ok">Mois clôturé : les saisies ne sont plus modifiables par les équipes.</div>`:`<div class="banner warn">Mois en cours : les chiffres évoluent avec les saisies des équipes.</div>`}
 <div class="kpis"><div class="kpi"><b>${h2s(T.h)}</b><span>heures totales</span></div><div class="kpi"><b>${h2s(T.hs)}</b><span>dont heures sup. (&gt; 35 h/sem.)</span></div>
 <div class="kpi"><b>${euro(T.mp)}</b><span>${T.p} paniers</span></div><div class="kpi"><b>${euro(T.mt)}</b><span>indemnités de trajet</span></div></div>
 <div class="tablewrap"><table><thead><tr><th>Salarié</th><th class="r">Jours</th><th class="r">Heures</th><th class="r">H. sup.</th><th class="r">Paniers</th>
 ${S.params.zones.map(z=>`<th class="r">${zoneTag(z,0)}</th>`).join("")}<th class="r">Trajet €</th><th class="r">Panier €</th><th>Absences</th><th></th></tr></thead>
 <tbody>${R.map(r=>`<tr><td>${esc(r.p.nom)}</td><td class="r num">${r.jours}</td><td class="r num">${h2s(r.h)}</td><td class="r num">${r.hs?h2s(r.hs):"—"}</td><td class="r num">${r.paniers}</td>
  ${[1,2,3,4,5].map(i=>`<td class="r num">${r.zones[i]||"·"}</td>`).join("")}<td class="r num">${euro(r.mtT)}</td><td class="r num">${euro(r.mtP)}</td>
  <td>${Object.entries(r.abs).map(([m,n])=>`<span class="pill warn">${esc(m)} ×${n}</span>`).join(" ")||"—"}</td><td><button class="btn ghost" data-f="${r.p.id}">Détail</button></td></tr>`).join("")}</tbody>
 <tfoot><tr><td>Total</td><td></td><td class="r num">${h2s(T.h)}</td><td class="r num">${h2s(T.hs)}</td><td class="r num">${T.p}</td>${[1,2,3,4,5].map(i=>`<td class="r num">${T.z[i]}</td>`).join("")}<td class="r num">${euro(T.mt)}</td><td class="r num">${euro(T.mp)}</td><td colspan="2"></td></tr></tfoot></table></div>
 <div id="out"></div><div id="fiche"></div>`;
 $("#mois").onchange=e=>{mois=e.target.value;vRecap()};
 $("#lock").onclick=()=>{S.verrous[mois]=!locked;if(locked)delete S.verrous[mois];save();vRecap();toast(locked?"Mois rouvert":"Mois clôturé")};
 $("#csv").onclick=()=>{const head="Matricule;Salarié;Jours travaillés;Heures;Heures sup;Nb paniers;Montant paniers;Trajet Z1;Trajet Z2;Trajet Z3;Trajet Z4;Trajet Z5;Montant trajet;Absences";
  const lines=R.map(r=>[String(r.p.id).padStart(4,"0"),r.p.nom,r.jours,r.h.toFixed(2).replace(".",","),r.hs.toFixed(2).replace(".",","),r.paniers,r.mtP.toFixed(2).replace(".",","),...r.zones.slice(1),r.mtT.toFixed(2).replace(".",","),Object.entries(r.abs).map(([m,n])=>m+" x"+n).join(" / ")].join(";"));
  const txt=[head,...lines].join("\n");
  $("#out").innerHTML=`<div class="panel" style="margin-top:16px"><div class="head" style="margin-bottom:8px"><h2>Export paie (CSV)</h2><button class="btn primary" id="cp">Copier</button></div><textarea id="csvtxt" readonly>${esc(txt)}</textarea><p class="note">Dans la version finale, le fichier se télécharge directement au format attendu par votre logiciel de paie (Silae, Sage, EBP…) ou votre expert-comptable.</p></div>`;
  $("#cp").onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>toast("Export copié"),()=>{$("#csvtxt").select();toast("Texte sélectionné : Ctrl+C pour copier")})}};
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{salFiche=+b.dataset.f;fiche()});
}
function fiche(){
 const p=SAL.find(s=>s.id===salFiche);const ks=Object.keys(S.saisies).filter(k=>k.startsWith(mois)).sort();
 const rows=ks.map(k=>{const e=S.saisies[k][p.id];if(!e)return"";const c=calc(e);const ch=S.chantiers.find(x=>x.id==e.lieu);
  return`<tr><td>${new Date(k+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"})}</td><td>${e.lieu==="abs"?`<span class="pill bad">${esc(e.motif)}</span>`:e.lieu==="depot"?"Dépôt / atelier":esc(ch?.nom||"?")}</td>
  <td class="r num">${c.present?h2s(c.h):"—"}</td><td class="r num">${c.km!=null?c.km.toFixed(1)+" km":"—"}</td><td>${zoneTag(c.zone,c.km)}</td><td>${e.vehicule?"Oui":"—"}</td><td class="r num">${euro(c.trajet)}</td><td class="r num">${euro(c.panier)}</td></tr>`}).join("");
 $("#fiche").innerHTML=`<div class="panel" style="margin-top:16px"><div class="head" style="margin-bottom:8px"><div><h2>${esc(p.nom)}</h2><p class="sub">Détail jour par jour · justificatif de calcul</p></div></div>
 <div class="tablewrap"><table><thead><tr><th>Jour</th><th>Lieu</th><th class="r">Heures</th><th class="r">Distance</th><th>Zone</th><th>Véhicule</th><th class="r">Trajet</th><th class="r">Panier</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
 $("#fiche").scrollIntoView({behavior:"smooth"});
}

/* ===== Validation ===== */
function vValidation(){
 const [y,m]=mois.split("-").map(Number);const nb=new Date(y,m,0).getDate();
 const days=[...Array(nb)].map((_,i)=>new Date(y,m-1,i+1)).filter(d=>isWorkday(d)&&d<=TODAY);
 const rows=days.map(d=>{const k=iso(d);const day=S.saisies[k]||{};const n=SAL.filter(p=>day[p.id]).length;const ok=S.valides[k];const fer=FERIES.includes(k);
  const st=fer?`<span class="pill warn">Férié</span>`:n===0?`<span class="pill bad">Non saisi</span>`:n<SAL.length?`<span class="pill warn">Incomplet ${n}/${SAL.length}</span>`:ok?`<span class="pill ok">Envoyé</span>`:`<span class="pill warn">À envoyer</span>`;
  const t=SAL.reduce((a,p)=>{const c=calc(day[p.id]);return{h:a.h+c.h,tr:a.tr+c.trajet,pa:a.pa+c.panier}},{h:0,tr:0,pa:0});
  return`<tr><td>${d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</td><td>${st}</td><td class="r num">${h2s(t.h)}</td><td class="r num">${euro(t.pa)}</td><td class="r num">${euro(t.tr)}</td><td><button class="btn ghost" data-d="${k}">Ouvrir</button></td></tr>`}).reverse().join("");
 $("#view").innerHTML=`<div class="head"><div><h1>Suivi des saisies</h1><p class="sub">Contrôle des journées remontées par les chefs d'équipe</p></div><div class="ctrl">${moisSelect()}</div></div>
 <div class="tablewrap"><table><thead><tr><th>Jour</th><th>Statut</th><th class="r">Heures</th><th class="r">Paniers</th><th class="r">Trajet</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="note">« Ouvrir » affiche la journée telle que saisie sur le terrain.</p>`;
 $("#mois").onchange=e=>{mois=e.target.value;vValidation()};
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{dateSel=b.dataset.d;role="chef";tab="saisie";$("#r-chef").setAttribute("aria-pressed",true);$("#r-bureau").setAttribute("aria-pressed",false);render()});
}

/* ===== Chantiers & zones ===== */
function vChantiers(){
 const list=S.chantiers.map(c=>({c,...chantierInfo(c)}));
 $("#view").innerHTML=`<div class="head"><div><h1>Chantiers & zones</h1><p class="sub">Zone calculée automatiquement à vol d'oiseau depuis ${DEPOT.nom}</p></div></div>
 <div class="grid2"><div class="panel"><h2>Carte des zones</h2><canvas class="map" id="map" width="600" height="600" role="img" aria-label="Carte des zones concentriques autour du dépôt"></canvas>
 <p class="note">Cercles de 10 km. Au-delà de la zone 5 : grand déplacement (GD), traité à part.</p></div>
 <div class="panel"><h2>Nouveau chantier</h2><div style="display:grid;gap:10px;margin-top:10px">
  <div class="field"><label for="nn">Nom du chantier</label><input id="nn" style="width:100%" placeholder="ex. Rénovation mairie"></div>
  <div class="field"><label for="nc">Commune / adresse</label><select id="nc">${COMMUNES.map(c=>`<option>${c[0]}</option>`).join("")}</select></div>
  <div class="calc" id="prev"></div>
  <button class="btn primary" id="add">Ajouter le chantier</button>
  <p class="note">Dans la version finale : saisie de l'adresse exacte avec géolocalisation automatique.</p></div></div></div>
 <div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>Chantier</th><th>Commune</th><th>Client</th><th class="r">Distance</th><th>Zone</th><th class="r">Indemnité / jour</th></tr></thead>
 <tbody>${list.map(x=>`<tr><td>${esc(x.c.nom)}</td><td>${esc(x.c.commune)}</td><td>${esc(x.c.client||"—")}</td><td class="r num">${x.km.toFixed(1)} km</td><td>${zoneTag(x.zone,x.km)}</td><td class="r num">${x.zone?euro(x.zone.mt):"Grand dépl."}</td></tr>`).join("")}</tbody></table></div>`;
 const upd=()=>{const km=dist(DEPOT,commune($("#nc").value)),z=zoneOf(km);$("#prev").innerHTML=`<span>Distance <b class="num">${km.toFixed(1)} km</b></span><span>${zoneTag(z,km)}</span><span>Indemnité <b class="num">${z?euro(z.mt):"grand déplacement"}</b></span>`};
 $("#nc").onchange=upd;upd();
 $("#add").onclick=()=>{const n=$("#nn").value.trim();if(!n){toast("Indique le nom du chantier");$("#nn").focus();return}
  S.chantiers.push({id:Math.max(...S.chantiers.map(c=>c.id))+1,nom:n,commune:$("#nc").value,client:""});save();vChantiers();toast("Chantier ajouté")};
 drawMap(list);
}
function drawMap(list){
 const cv=$("#map"),g=cv.getContext("2d"),cs=getComputedStyle(document.documentElement),W=600,c=W/2,sc=c/55;
 const v=n=>cs.getPropertyValue(n).trim();g.clearRect(0,0,W,W);
 const kmLat=111,kmLon=111*Math.cos(DEPOT.lat*Math.PI/180);
 for(let i=5;i>=1;i--){g.beginPath();g.arc(c,c,i*10*sc,0,7);g.fillStyle=v("--z"+i);g.globalAlpha=.28;g.fill();g.globalAlpha=1;g.strokeStyle=v("--z"+i);g.stroke();
  g.fillStyle=v("--muted");g.font="600 13px "+v("--mono");g.fillText("Z"+i,c+4,c-i*10*sc+16)}
 g.fillStyle=v("--fg");g.fillRect(c-6,c-6,12,12);g.font="600 14px "+v("--body");g.fillText("Dépôt",c+10,c+5);
 list.forEach(x=>{const p=commune(x.c.commune);const X=c+(p.lon-DEPOT.lon)*kmLon*sc,Y=c-(p.lat-DEPOT.lat)*kmLat*sc;
  const out=X<0||X>W||Y<0||Y>W;const cx=Math.min(W-10,Math.max(10,X)),cy=Math.min(W-10,Math.max(10,Y));
  g.beginPath();g.arc(cx,cy,7,0,7);g.fillStyle=out?v("--bad"):v("--accent");g.fill();g.strokeStyle=v("--fg");g.lineWidth=1.5;g.stroke();g.lineWidth=1;
  g.fillStyle=v("--fg");g.font="600 13px "+v("--body");const t=x.c.commune+(out?" →":"");const tw=g.measureText(t).width;g.fillText(t,cx+tw+12>W?cx-tw-10:cx+10,cy+4)});
}

/* ===== Paramètres ===== */
function vParams(){
 const P=S.params;
 $("#view").innerHTML=`<div class="head"><div><h1>Paramètres</h1><p class="sub">Barèmes à ajuster selon votre convention collective et les accords régionaux</p></div></div>
 <div class="grid2"><div class="panel"><h2>Indemnités de trajet — 5 zones</h2>
  <div class="zonegrid" style="margin-top:12px"><b></b><small class="sub">De (km)</small><small class="sub">À (km)</small><small class="sub">€ / jour</small>
  ${P.zones.map((z,i)=>`${zoneTag(z,0)}<input type="number" step="1" id="zmin${i}" value="${z.min}" aria-label="Zone ${z.z} début"><input type="number" step="1" id="zmax${i}" value="${z.max}" aria-label="Zone ${z.z} fin"><input type="number" step="0.01" id="zmt${i}" value="${z.mt.toFixed(2)}" aria-label="Zone ${z.z} montant">`).join("")}</div>
  <p class="note">Indemnité versée par jour de présence sur un chantier, lorsque le salarié s'y rend avec un véhicule de l'entreprise. Distance à vol d'oiseau depuis le dépôt.</p></div>
 <div class="panel"><h2>Panier & horaires</h2><div style="display:grid;gap:10px;margin-top:12px">
  <div class="field"><label for="pan">Indemnité de panier (€ / jour)</label><input id="pan" type="number" step="0.01" value="${P.panier.toFixed(2)}"></div>
  <div class="field"><label for="dep">Dépôt de référence</label><input id="dep" value="${DEPOT.nom}" disabled></div>
  <p class="note">Le panier est proposé coché par défaut sur chantier et décoché au dépôt ; le chef d'équipe peut toujours le modifier.</p>
  <button class="btn" id="reset">Réinitialiser les données de démonstration</button></div></div></div>
 <div class="ctrl" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" id="sv">Enregistrer les barèmes</button></div>`;
 $("#sv").onclick=()=>{P.zones.forEach((z,i)=>{z.min=+$("#zmin"+i).value;z.max=+$("#zmax"+i).value;z.mt=+$("#zmt"+i).value});P.panier=+$("#pan").value;save();toast("Barèmes enregistrés : les calculs sont mis à jour")};
 let armed=false;$("#reset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Confirmer la réinitialisation";return}S=seed();save();vParams();toast("Données de démonstration rechargées")};
}

render();
</script>
