name: terricom

on:
  push:
    branches: [main, 'claude/**']
    tags: ['terricom-v*']
    paths: ['terricom/**', '.github/workflows/terricom.yml']
  pull_request:
    paths: ['terricom/**', '.github/workflows/terricom.yml']
  workflow_dispatch:

concurrency:
  group: terricom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: terricom

env:
  NODE_VERSION: '22'
  # Valeurs de test uniquement (aucun secret réel dans la CI).
  SESSION_SECRET: ci-session-secret-0123456789abcdef
  DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  ANALYTICS_SALT: ci-analytics-salt
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Qualité (types, lint, tests unitaires, compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: terricom/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,tsx}" "tests/**/*.ts"
      - run: npm test
      - run: npm run build
      - name: Manifestes Kubernetes (kustomize)
        run: |
          kubectl kustomize deploy/kubernetes/overlays/production > /dev/null
          kubectl kustomize deploy/kubernetes/overlays/demo > /dev/null

  e2e:
    name: Parcours de bout en bout (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: terricom
          POSTGRES_USER: terricom
          POSTGRES_PASSWORD: terricom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U terricom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://terricom:terricom@localhost:5432/terricom
      APP_URL: http://localhost:3000
      DEMO_MODE: 'true'
      MAIL_DRIVER: outbox
      E2E_START: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: terricom/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: terricom/playwright-report
          retention-days: 7

  images:
    name: Images Docker (web, outils)
    needs: [checks, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/terricom-${{ matrix.target }}
          tags: |
            type=sha
            type=ref,event=branch
            type=match,pattern=terricom-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: terricom
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true
