<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>terricom · teaser</title>
<style>
@font-face { font-family: 'Bricolage'; font-weight: 200 800; src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2') format('woff2-variations'); }
@font-face { font-family: 'Instrument'; font-weight: 400 700; src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2-variations'); }
html, body { margin: 0; background: #000; }
#stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #14201B; font-family: 'Bricolage'; }
.layer { position: absolute; inset: 0; }
#shot { position: absolute; left: 50%; top: 50%; will-change: transform; }
#shot .bar { height: 42px; background: #EFEBE1; border-radius: 22px 22px 0 0; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
#shot .bar i { width: 13px; height: 13px; border-radius: 50%; background: #D3CCBC; }
#shot img { display: block; width: 100%; }
#shot.framed { border-radius: 22px; box-shadow: 0 40px 90px rgba(0,0,0,.45); background: #FFFDF8; }
#shot.framed img { border-radius: 0 0 22px 22px; }
#shot.phone { background: #14201B; border-radius: 60px; padding: 14px; box-shadow: 0 40px 90px rgba(0,0,0,.5); }
#shot.phone img { border-radius: 47px; }
#shot.phone .bar, #shot.crop .bar { display: none; }
#flash { background: #fff; opacity: 0; }
#words { display: grid; place-items: center; pointer-events: none; }
#word { font-weight: 800; letter-spacing: -0.045em; line-height: .95; text-align: center; color: #F7F4EC; font-size: 150px; text-shadow: 0 8px 40px rgba(0,0,0,.35); }
#word em { font-style: normal; color: #F4B266; }
#tag { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%) rotate(-4deg); background: #F4B266; color: #14201B; font-weight: 800; font-size: 54px; padding: 16px 34px; border-radius: 22px; white-space: nowrap; box-shadow: 0 18px 40px rgba(0,0,0,.3); }
#end { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; background: #14201B; opacity: 0; }
.logo { display: flex; align-items: center; gap: 40px; }
.mark { width: 190px; height: 190px; border-radius: 50% 50% 50% 14%; transform: rotate(-45deg); background: #F4B266; display: grid; place-items: center; }
.mark span { transform: rotate(45deg); font-weight: 800; font-size: 130px; color: #14201B; margin-top: -16px; line-height: 1; }
.wm { font-weight: 800; letter-spacing: -0.05em; font-size: 250px; color: #F7F4EC; line-height: .9; }
.wm i { color: #F4B266; font-style: normal; }
.slogan { font-size: 76px; font-weight: 800; letter-spacing: -0.035em; color: #F7F4EC; }
.slogan em { font-style: normal; color: #F4B266; }
.domain { font-family: 'Instrument'; font-weight: 600; font-size: 46px; color: #14201B; background: #F4B266; padding: 14px 40px; border-radius: 999px; }
#vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45)); pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div id="shot"><div class="bar"><i></i><i></i><i></i></div><img id="img" alt=""></div>
  <div class="layer" id="flash"></div>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="words"><div id="word"></div></div>
  <div id="tag" style="display:none"></div>
  <div class="layer" id="end">
    <div class="logo"><div class="mark"><span>t</span></div><div class="wm">terricom<i>.</i></div></div>
    <div class="slogan">Le territoire, <em>en vitrine.</em></div>
    <div class="domain">terricom.fr</div>
  </div>
</div>
<script>
// Calage sur la musique (docs/teaser/musique.mp3, 140 BPM) : temps n à 0,415 s + n × 0,4285 s.
// Repères : 3 premier grondement, 11 et 19 impacts, 35 drop, 58 impact final (logo).
const P = 0.4285, T0 = 0.415, DURATION = 28.6;
const DESK = ['p-accueil','c-tableau','p-explorer','e-tableau','p-campagne','c-ia','p-circuit','e-ia','p-fiche','c-statistiques','k-tableau','p-commune','c-newsletter','p-minisite','e-kit','p-agenda','c-campagnes','p-emploi','e-publications','c-circuits','c-personnalisation','e-offre','c-entreprises','p-ouvert','m-site','e-minisite','c-revendications'];
const PHONES = ['m-accueil','m-fiche','m-explorer-de'];
const COLORS = ['#1F6B52','#14201B','#F4B266','#6E2A2A','#1F6B52','#F7F4EC','#14201B'];
const imgs = {};
async function preload() {
  await Promise.all([...DESK, ...PHONES].map(n => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = `../dossier/captures/${n}.jpg`; imgs[n] = i; })));
  await document.fonts.ready;
}
const rnd = (k) => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const ease = (p) => 1 - Math.pow(1 - p, 3);
const pop = (p) => { const c = 1.7; p = Math.min(1, p); return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

const WORDS = [
  [3, 5, 'Vos <em>commerces.</em>'], [5, 7, 'Vos <em>communes.</em>'], [7, 9, 'Votre <em>territoire.</em>'], [9, 11, 'Et si tout était<br><em>en vitrine ?</em>'],
  [12, 14, 'Chercher.'], [14, 16, 'Trouver.'], [16, 19, '<em>Pousser la porte.</em>'],
  [33, 35, '<em>Prêts ?</em>'], [55, 58, 'Bientôt sur<br><em>votre territoire.</em>'],
];
const TAGS = [[19, 23, 'Une fiche pour chaque commerce'], [23, 27, 'Ouvert maintenant'], [27, 31, 'Campagnes clés en main'], [31, 33, 'Circuits à tampons'],
  [35, 39, 'Publier en une phrase'], [39, 43, 'Dans la poche'], [43, 47, '3 langues'], [47, 51, 'Hébergé en France'], [51, 55, 'Gratuit pour chaque commerce']];

const $ = (id) => document.getElementById(id);
let current = '';
async function render(t) {
  const beat = (t - T0) / P;
  const stage = $('stage');
  const END = 58;
  $('end').style.opacity = beat >= END ? 1 : 0;
  if (beat >= END) {
    const ep = (beat - END) / 1.2;
    document.querySelector('.logo').style.transform = `scale(${0.4 + 0.6 * pop(Math.max(0, ep))})`;
    const sl = Math.min(1, Math.max(0, (beat - END - 1.2) / 1));
    document.querySelector('.slogan').style.cssText = `opacity:${sl};transform:translateY(${(1 - ease(sl)) * 40}px)`;
    const dm = Math.min(1, Math.max(0, (beat - END - 2.6) / 1));
    document.querySelector('.domain').style.cssText = `opacity:${dm};transform:scale(${0.6 + 0.4 * pop(dm)})`;
    $('flash').style.opacity = Math.max(0, 0.95 - (beat - END) * 1.2);
    return;
  }
  // Longueur des coupes selon la section
  const cutLen = beat < 11 ? 2 : beat < 19 ? 1 : beat < 33 ? 1 : beat < 35 ? 0.25 : beat < 55 ? 0.5 : 0.25;
  const cut = Math.floor(beat / cutLen);
  const local = beat < 0 ? 0 : (beat - cut * cutLen) / cutLen;
  const k = cut * 7 + Math.floor(cutLen * 8);
  const r1 = rnd(k), r2 = rnd(k + 1), r3 = rnd(k + 2), r4 = rnd(k + 3);
  const shot = $('shot'), img = $('img');
  let mode = beat < 19 ? 'crop' : r1 < 0.12 ? 'phone' : r1 < 0.55 ? 'framed' : 'crop';
  if (beat >= 33 && beat < 35) mode = 'crop';
  const pool = mode === 'phone' ? PHONES : DESK;
  const name = pool[Math.floor(r2 * pool.length * 7) % pool.length];
  if (current !== name) { img.src = imgs[name].src; current = name; await img.decode().catch(() => {}); }
  stage.style.background = beat < 11 ? '#14201B' : COLORS[((cut % COLORS.length) + COLORS.length) % COLORS.length];
  shot.className = mode;
  let tr = '', blur = 0;
  if (mode === 'framed') {
    shot.style.width = '1560px';
    tr = `translate(-50%,-50%) translate(${(r4 - 0.5) * 120 * (1 - local)}px, ${(1 - ease(local)) * 60}px) rotate(${(r3 - 0.5) * 5}deg) scale(${1.14 - 0.1 * ease(local)})`;
  } else if (mode === 'phone') {
    shot.style.width = '430px';
    tr = `translate(-50%,-50%) translateY(${(1 - ease(Math.min(1, local * 2))) * 500}px) rotate(${(r3 - 0.5) * 12}deg)`;
  } else {
    shot.style.width = '1920px';
    const z = (beat < 19 ? 2.1 + r3 * 1.2 : 1.55 + r3 * 0.7) - 0.25 * local;
    tr = `translate(-50%,-50%) translate(${(r4 - 0.5) * (beat < 19 ? 1400 : 700) + (r1 - 0.5) * 300 * local}px, ${(r2 - 0.5) * (beat < 19 ? 700 : 380) - 120 * local}px) scale(${z})`;
    blur = beat < 11 ? 14 : beat < 19 ? 3 : beat >= 33 && beat < 35 ? 5 : 1.2;
  }
  shot.style.transform = tr;
  shot.style.filter = blur ? `blur(${blur}px) saturate(1.1)` : 'none';
  let op = beat < 11 ? 0.45 : beat >= 33 && beat < 35 ? (local < 0.4 ? 0.9 : 0.08) : 1;
  if (beat < 3) op *= Math.max(0, Math.min(1, (t - 0.6) / 1.2));
  shot.style.opacity = op;
  // Flashs sur les impacts et au rythme des drops
  let fl = beat >= 19 && local < 0.18 && cut % 2 === 0 ? 0.45 * (1 - local / 0.18) : 0;
  for (const h of [3, 11, 19, 35]) if (beat >= h && beat < h + 0.7) fl = Math.max(fl, 0.9 * (1 - (beat - h) / 0.7));
  $('flash').style.opacity = fl;
  const w = WORDS.find(([a, b]) => beat >= a && beat < b);
  const word = $('word');
  if (w) { word.innerHTML = w[2]; word.style.transform = `scale(${0.6 + 0.4 * pop(Math.max(0, (beat - w[0]) / 0.35))})`; word.style.opacity = 1; }
  else word.style.opacity = 0;
  $('vignette').style.opacity = w ? 1 : 0.6;
  if (w) { shot.style.opacity = Math.min(parseFloat(shot.style.opacity), mode === 'crop' ? 0.35 : 0.25); if (beat >= 55) stage.style.background = '#14201B'; }
  const g = TAGS.find(([a, b]) => beat >= a && beat < b);
  const tag = $('tag');
  if (g) { tag.style.display = 'block'; tag.textContent = g[2]; tag.style.transform = `translateX(-50%) rotate(${(g[0] % 8 < 4 ? 3 : -4)}deg) scale(${0.5 + 0.5 * pop(Math.max(0, (beat - g[0]) / 0.3))})`; }
  else tag.style.display = 'none';
}
window.clip = { preload, render, duration: DURATION };
</script>
</body>
</html>
