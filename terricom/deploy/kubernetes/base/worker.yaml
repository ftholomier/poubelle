# Worker : file de tâches PostgreSQL et tâches planifiées. Deux réplicas actifs-actifs
# (FOR UPDATE SKIP LOCKED : aucune tâche exécutée deux fois), arrêt propre sur SIGTERM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terricom-worker
  labels:
    app.kubernetes.io/name: terricom-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: terricom
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: terricom-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terricom-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: terricom
    spec:
      serviceAccountName: terricom-worker
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: terricom-worker
      containers:
        - name: worker
          image: terricom-tools
          command: ['node', '--import', 'tsx', 'scripts/worker.ts']
          ports:
            - name: health
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: terricom-config
            - secretRef:
                name: terricom-secrets
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: terricom-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terricom-worker
