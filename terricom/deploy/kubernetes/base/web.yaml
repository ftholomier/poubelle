# Application web (Next.js) : 3 réplicas minimum répartis sur les zones de disponibilité,
# mises à jour sans interruption, migrations de schéma appliquées avant démarrage (verrou consultatif).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terricom-web
  labels:
    app.kubernetes.io/name: terricom-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: terricom
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terricom-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terricom-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: terricom
    spec:
      serviceAccountName: terricom-web
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: terricom-web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: terricom-web
      initContainers:
        - name: migrate
          image: terricom-tools
          command: ['node', '--import', 'tsx', 'scripts/migrate.ts']
          envFrom:
            - configMapRef:
                name: terricom-config
            - secretRef:
                name: terricom-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
      containers:
        - name: web
          image: terricom-web
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: terricom-config
            - secretRef:
                name: terricom-secrets
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            # Laisse le temps aux répartiteurs de retirer le pod avant l'arrêt (aucune requête perdue).
            preStop:
              exec:
                command: ['sleep', '8']
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: terricom-web
  labels:
    app.kubernetes.io/name: terricom-web
spec:
  selector:
    app.kubernetes.io/name: terricom-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terricom-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terricom-web
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: terricom-web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: terricom-web
