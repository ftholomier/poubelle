# Comptes de service à privilèges minimaux :
#  - web : lecture de l'état des déploiements pour la console (Audit & sécurité → Infrastructure) ;
#  - worker : gestion de l'Ingress des domaines personnalisés (certificats cert-manager).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terricom-web
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terricom-worker
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terricom-infra-reader
rules:
  - apiGroups: ['apps']
    resources: ['deployments', 'statefulsets']
    verbs: ['get', 'list']
  - apiGroups: ['batch']
    resources: ['cronjobs']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terricom-web-infra-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terricom-infra-reader
subjects:
  - kind: ServiceAccount
    name: terricom-web
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terricom-custom-domains
rules:
  - apiGroups: ['networking.k8s.io']
    resources: ['ingresses']
    resourceNames: ['terricom-custom-domains']
    verbs: ['get', 'patch', 'delete']
  # « create » ne peut pas être restreint par nom : l'application côté serveur crée l'Ingress au premier passage.
  - apiGroups: ['networking.k8s.io']
    resources: ['ingresses']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terricom-worker-custom-domains
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terricom-custom-domains
subjects:
  - kind: ServiceAccount
    name: terricom-worker
