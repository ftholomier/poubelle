# Analyse antivirus des documents téléversés (Kbis, CV, documents commerciaux) : clamd, protocole INSTREAM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terricom-clamav
  labels:
    app.kubernetes.io/name: terricom-clamav
    app.kubernetes.io/component: antivirus
    app.kubernetes.io/part-of: terricom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: terricom-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terricom-clamav
        app.kubernetes.io/component: antivirus
        app.kubernetes.io/part-of: terricom
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clamav
          image: clamav/clamav:stable
          ports:
            - name: clamd
              containerPort: 3310
          readinessProbe:
            tcpSocket: { port: clamd }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 1536Mi }
            limits: { memory: 3Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: terricom-clamav
spec:
  selector:
    app.kubernetes.io/name: terricom-clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
