# Secrets applicatifs synchronisés depuis le coffre-fort (External Secrets Operator :
# Scaleway Secret Manager, OVHcloud KMS, HashiCorp Vault…). Aucun secret n'est versionné.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: terricom-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: coffre-fort
  target:
    name: terricom-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: terricom/production
