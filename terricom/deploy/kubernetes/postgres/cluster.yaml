# PostgreSQL 16 haute disponibilité avec l'opérateur CloudNativePG (https://cloudnative-pg.io) :
# 3 instances réparties sur 3 zones, réplication synchrone (aucune perte de transaction validée
# en cas de bascule), archivage continu des WAL et sauvegardes de base sur stockage objet
# (restauration à un instant donné), chiffrement côté serveur.
# Alternative : base PostgreSQL managée en France (Scaleway, OVHcloud, Outscale) — renseigner
# alors DATABASE_URL dans le Secret et ne pas appliquer ce fichier.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: terricom-pg
  namespace: terricom
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised
  minSyncReplicas: 1
  maxSyncReplicas: 1
  postgresql:
    parameters:
      max_connections: '200'
      shared_buffers: 1GB
      work_mem: 16MB
      timezone: Europe/Paris
      log_min_duration_statement: '500'
  bootstrap:
    initdb:
      database: terricom
      owner: terricom
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS citext
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        - CREATE EXTENSION IF NOT EXISTS unaccent
  storage:
    size: 50Gi
    storageClass: sbs-default
  walStorage:
    size: 10Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
    podAntiAffinityType: required
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 4Gi }
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://terricom-sauvegardes/cnpg
      endpointURL: https://s3.fr-par.scw.cloud
      s3Credentials:
        accessKeyId: { name: terricom-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: terricom-backup-s3, key: SECRET_ACCESS_KEY }
      wal:
        compression: gzip
        encryption: AES256
      data:
        compression: gzip
        encryption: AES256
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: terricom-pg-daily
  namespace: terricom
spec:
  schedule: '0 30 1 * * *'
  backupOwnerReference: self
  cluster:
    name: terricom-pg
---
# Pooler de connexions (PgBouncer) en mode session (verrous consultatifs des migrations), devant l’instance primaire.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: terricom-pg-rw
  namespace: terricom
spec:
  cluster:
    name: terricom-pg
  instances: 2
  type: rw
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: '500'
      default_pool_size: '40'
