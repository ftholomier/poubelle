# Émetteurs de certificats Let's Encrypt (cert-manager).
#  - letsencrypt-dns01 : certificat générique *.terricom.fr (défi DNS-01). Exemple avec le webhook
#    Scaleway ; adapter le solveur au fournisseur DNS (OVHcloud, Gandi, Cloudflare…).
#  - letsencrypt-http01 : domaines personnalisés des collectivités (défi HTTP-01 via ingress-nginx).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: technique@terricom.fr
    privateKeySecretRef:
      name: letsencrypt-dns01-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.scaleway.com
            solverName: scaleway
            config:
              accessKeySecretRef: { name: scaleway-dns, key: SCW_ACCESS_KEY }
              secretKeySecretRef: { name: scaleway-dns, key: SCW_SECRET_KEY }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: technique@terricom.fr
    privateKeySecretRef:
      name: letsencrypt-http01-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
