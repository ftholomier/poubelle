<style>
:root{--navy:#0E1F4D;--blue:#1F3FA8;--yellow:#F6C400;--cream:#F3EDDF;--sand:#E8DFC9;--paper:#FFFDF6;--muted:#3A4A75}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--navy);font-family:'Newsreader',Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:var(--navy);text-decoration:none}a:hover{color:var(--blue)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{height:76px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:2px solid var(--navy);background:var(--cream);position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:54px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.brand:hover img{transform:rotate(-10deg) scale(1.08)}
.brand b{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;line-height:1}
.brand i{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.tabs{display:flex;margin-left:auto;border:2px solid var(--navy);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 16px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:background .2s}
.tab[aria-selected=true]{background:var(--navy);color:var(--yellow)}
.tab:not([aria-selected=true]):hover{background:var(--yellow)}
.back{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.don{background:var(--yellow);border:2px solid var(--navy);box-shadow:4px 4px 0 var(--navy);padding:9px 14px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.app{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);height:calc(100vh - 76px)}
.panel{border-right:2px solid var(--navy);display:flex;flex-direction:column;min-height:0;background:var(--cream)}
.phead{padding:20px 22px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--navy)}
.eyebrow{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
.ptitle{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:42px;line-height:.95;text-transform:uppercase}

.filters{padding:12px 22px;display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--navy);max-height:46vh;overflow:auto}
.flabel{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{border:2px solid var(--navy);padding:4px 9px;font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;background:var(--paper);transition:background .15s;white-space:nowrap}
.chip:hover{background:var(--yellow)}.chip.on{background:var(--navy);color:var(--yellow)}
.chip.v.on{background:var(--yellow);color:var(--navy)}.chip.dd.on{background:var(--navy);color:var(--cream)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:8px;border:2px solid var(--navy);padding:5px 10px;font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;background:var(--paper)}
.tg i{width:28px;height:16px;border:2px solid var(--navy);border-radius:10px;position:relative;transition:background .2s}
.tg i:after{content:'';position:absolute;top:1px;left:1px;width:10px;height:10px;border-radius:50%;background:var(--navy);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tg.on i{background:var(--yellow)}.tg.on i:after{transform:translateX(12px)}
.timeline{display:flex;align-items:center;gap:10px;margin-top:5px}
.play{width:38px;height:38px;flex-shrink:0;background:var(--navy);color:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:15px}
.play:hover{background:var(--blue)}
input[type=range]{flex:1;accent-color:var(--blue)}
.year{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.listhead{padding:10px 22px;display:flex;justify-content:space-between;align-items:baseline;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.list{flex:1;overflow:auto;min-height:0;padding:0 12px 16px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-bottom:1px solid rgba(14,31,77,.15);transition:background .15s,padding .2s}
.row:hover,.row.hl{background:var(--paper);padding-left:16px}
.row.sel{background:var(--yellow)}
.rank{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:18px;color:var(--blue)}

.rmeta{font-size:13px;color:var(--muted)}
.rnum{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;text-align:right}
.bar{display:flex;height:6px;margin-top:4px;border:1px solid var(--navy)}
.bar span{display:block;height:100%}
.mapwrap{position:relative;min-width:0;overflow:hidden}
#map{position:absolute;inset:0;background:#EDE5D2;font-family:'Newsreader',serif}
.leaflet-tile-pane{filter:grayscale(1) sepia(.35) brightness(1.04) contrast(.88)}
.leaflet-container a{color:var(--blue)}
.leaflet-control-attribution{background:rgba(255,253,246,.85)!important;font-size:11px}
.leaflet-tooltip.tt{background:var(--navy);color:var(--cream);border:2px solid var(--yellow);border-radius:0;box-shadow:none;font-size:15px;padding:7px 11px}

.leaflet-tooltip.tt b{display:block;font-family:'Big Shoulders Display',sans-serif;font-size:19px;text-transform:uppercase;color:var(--yellow)}
.leaflet-tooltip.lbl{background:none;border:0;box-shadow:none;padding:0 0 0 4px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:14px;text-transform:uppercase;color:var(--navy);text-shadow:0 0 3px #F3EDDF,0 0 3px #F3EDDF,0 0 3px #F3EDDF}

.route{stroke-linecap:round}

.cl.one{background:var(--yellow);color:var(--navy);border-color:var(--navy)}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.pin span{transform:rotate(45deg);font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:15px}
.pin.ind{border-style:dashed}
.pin:hover{transform:rotate(-45deg) scale(1.15)}
.legend{position:absolute;left:16px;bottom:24px;background:var(--paper);border:2px solid var(--navy);padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;z-index:800}
.legend .d{font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase;font-weight:800;font-size:13px;letter-spacing:.14em}
.lg{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border:2px solid var(--navy);border-radius:50%}
.note{font-style:italic;font-size:12px;color:var(--muted)}
.zoom{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;border:2px solid var(--navy);background:var(--paper);z-index:800}
.zoom button{width:40px;height:40px;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:20px}
.zoom button+button{border-top:2px solid var(--navy)}
.zoom button:hover{background:var(--yellow)}
.drawer{position:absolute;right:16px;top:16px;bottom:24px;width:min(380px,calc(100% - 32px));background:var(--paper);border:3px solid var(--navy);box-shadow:10px 10px 0 var(--yellow);transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.3,1.2,.5,1);z-index:900;display:flex;flex-direction:column;overflow:auto}
.drawer.open{transform:none}
.dhead{background:var(--navy);color:var(--cream);padding:18px 20px;display:flex;flex-direction:column;gap:4px;position:relative}
.dhead .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border:2px solid var(--cream);color:var(--cream);font-weight:900}
.dhead .x:hover{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.dtitle{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:34px;line-height:1;text-transform:uppercase;padding-right:40px}
.dbody{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--navy)}
.stats div{padding:10px 8px;border-right:2px solid var(--navy);display:flex;flex-direction:column}
.stats div:last-child{border-right:0}
.stats b{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:30px;line-height:1}
.stats span{font-size:13px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:2px solid var(--navy)}
.spark div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.spark i{display:block;width:100%;background:var(--blue);transition:height .5s cubic-bezier(.3,1.3,.5,1)}
.spark small{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:11px}
.mlist{display:flex;flex-direction:column}
.mitem{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(14,31,77,.15);font-size:15px}
.mitem b{font-family:'Big Shoulders Display',sans-serif;font-size:18px}
.res{width:24px;height:24px;border:2px solid var(--navy);display:inline-flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:13px}
.badge{display:inline-block;border:2px solid var(--navy);padding:1px 6px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.cta{align-self:flex-start;background:var(--navy);color:var(--yellow);padding:12px 18px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:16px;letter-spacing:.1em;text-transform:uppercase;transition:transform .2s}
.cta:hover{transform:translateY(-2px);color:var(--yellow)}
.steps{flex:1;overflow:auto;min-height:0;padding:8px 12px 16px}
.step{display:grid;grid-template-columns:48px 1fr;gap:12px;text-align:left;width:100%;padding:12px 10px;border-bottom:1px solid rgba(14,31,77,.15);transition:background .2s}
.step:hover{background:var(--paper)}
.step.on{background:var(--yellow)}
.step .n{width:44px;height:44px;border-radius:50%;border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:16px;background:var(--paper)}
.step.on .n{background:var(--navy);color:var(--yellow)}
.story{position:absolute;left:16px;right:72px;bottom:24px;max-width:640px;background:var(--navy);color:var(--cream);border:3px solid var(--yellow);padding:18px 22px;display:flex;gap:18px;align-items:center;z-index:850;transform:translateY(20px);opacity:0;pointer-events:none;transition:transform .4s,opacity .4s}
.story.show{transform:none;opacity:1;pointer-events:auto}
.story .yr{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:56px;line-height:.9;color:var(--yellow)}
.story h3{margin:0 0 4px;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:24px;text-transform:uppercase}
.story p{margin:0;font-size:16px;line-height:1.4}
.snav{display:flex;gap:6px;margin-left:auto}
.snav button{width:40px;height:40px;border:2px solid var(--cream);font-weight:900}
.snav button:hover{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
@media (max-width:1180px){.brand div,.back{display:none}.tab{padding:9px 12px;font-size:16px}}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto}.panel{order:2;border-right:0;border-top:2px solid var(--navy)}.mapwrap{order:1;height:56vh}.brand div,.back,.don{display:none}.top{gap:10px;padding:0 12px}.tab{padding:8px 10px;font-size:15px}.list,.steps{max-height:60vh}}
</style>

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rng = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(1928);
  const pick = w => { const r = rng(); let a = 0; for (const [k, p] of w) { a += p; if (r < a) return k; } return w[w.length - 1][0]; };
  const HOME = [47.5122, 6.8111];

    ['gg', 'Geoffroy-Guichard', 'Saint-Étienne', [45.4608, 4.3903]], ['nantes', 'La Beaujoire', 'Nantes', [47.2560, -1.5245]], ['bdx', 'Lescure', 'Bordeaux', [44.829, -0.598]],
    ['lens', 'Bollaert', 'Lens', [50.4329, 2.8150]], ['lille', 'Stade de Lille', 'Lille', [50.6119, 3.1305]], ['meinau', 'La Meinau', 'Strasbourg', [48.5598, 7.7550]],
    ['metz', 'Saint-Symphorien', 'Metz', [49.1098, 6.1594]], ['nancy', 'Marcel-Picot', 'Nancy', [48.6953, 6.2108]], ['aux', 'Abbé-Deschamps', 'Auxerre', [47.7870, 3.5887]],

      const cnt = new Map(byIso), mx = d3.max(byIso, d => d[1]) || 1, col = d3.scaleSqrt().domain([0, mx]).range([.15, 1]), ip = d3.interpolateRgb(C.yellow, C.navy);
      geo = L.geoJSON(land, { style: f => { const n = cnt.get(f.id); return { fillColor: n ? ip(col(n)) : 'transparent', fillOpacity: n ? .85 : 0, color: n ? C.navy : 'transparent', weight: 1 }; },
        onEachFeature: (f, l) => { const n = cnt.get(f.id); if (!n) return; l.bindTooltip(`<b>${cname[f.id]}</b>${n} personne${n > 1 ? 's' : ''}`, { className: 'tt', sticky: true }); l.on('mouseover', () => l.setStyle({ weight: 3 })).on('mouseout', () => l.setStyle({ weight: 1 })).on('click', () => openCountry(f.id)); } }).addTo(layer);
      legend.innerHTML = `<span class="d">Personnes par pays</span><div style="width:180px;height:12px;border:2px solid var(--navy);background:linear-gradient(90deg,${ip(.15)},${C.navy})"></div><div style="display:flex;justify-content:space-between;font-size:13px"><span>peu</span><span>beaucoup</span></div><span class="note">Effectifs d'exemple</span>`;
    }
  }
  function drawClusters() {
    layer.clearLayers(); const z = map.getZoom(), cell = 64, groups = new Map();
    ppl.forEach(p => { const pt = map.project(p.ll, z); const key = Math.floor(pt.x / cell) + ':' + Math.floor(pt.y / cell); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(p); });
    groups.forEach(g => {
      const lat = d3.mean(g, p => p.ll[0]), lon = d3.mean(g, p => p.ll[1]); const citiesIn = [...new Set(g.map(p => p.city))]; const one = citiesIn.length === 1;
      const size = Math.round(26 + Math.sqrt(g.length) * 7);
      const icon = L.divIcon({ className: '', html: `<div class="cl${g.length === 1 ? ' one' : ''}" style="width:${size}px;height:${size}px;font-size:${Math.min(22, 12 + Math.sqrt(g.length) * 2)}px">${g.length}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
      const m = L.marker([lat, lon], { icon }).addTo(layer);
      m.bindTooltip(`<b>${one ? citiesIn[0] : citiesIn.length + ' villes'}</b>${g.length} personne${g.length > 1 ? 's' : ''}${one ? '' : '<br>' + citiesIn.slice(0, 4).join(', ') + (citiesIn.length > 4 ? '…' : '')}`, { className: 'tt', direction: 'top', offset: [0, -size / 2] });
      m.on('click', () => one ? openCity(citiesIn[0]) : map.flyToBounds(L.latLngBounds(g.map(p => p.ll)), { padding: [80, 80], maxZoom: 12, duration: reduce ? 0 : .8 }));
    });
  }
  function personList(v) {
    const named = v.filter(p => p.name), anon = v.length - named.length;
    return `<div class="mlist">${named.map(p => `<a class="mitem" href="Fiche%20Joueur.dc.html"><b>→</b><span>${p.name}${p.intl ? '<span class="badge">International</span>' : ''}${p.forme ? '<span class="badge">Formé au club</span>' : ''}</span><span class="rmeta">${p.poste || p.rub}</span></a>`).join('')}${anon ? `<div class="mitem"><b>+${anon}</b><span>fiche${anon > 1 ? 's' : ''} à relier depuis la base</span><span></span></div>` : ''}</div>`;
  }
  function originBody(v) {
    const by = k => d3.rollup(v, x => x.length, p => p[k]);
    const rub = by('rub'), po = by('poste');
    return `<div class="stats"><div><b>${v.length}</b><span>au total</span></div><div><b>${rub.get('Joueur') || 0}</b><span>joueurs</span></div><div><b>${v.filter(p => p.forme).length}</b><span>formés</span></div><div><b>${v.filter(p => p.intl).length}</b><span>internat.</span></div></div>
      <div><span class="flabel">Par poste</span><div class="chips">${POSTES.map(p => `<span class="chip">${p} · ${po.get(p) || 0}</span>`).join('')}</div></div>
      <div><span class="flabel">Décennie d'arrivée</span>${spark(DEC.map(d => ({ d, n: v.filter(p => p.dec === d).length })))}</div>
      <div><span class="flabel">Fiches</span>${personList(v)}</div>`;
  }
  function openCity(city, fly) {
    const v = ppl.filter(p => p.city === city); if (!v.length) return;
    openDrawer(`${head('Né(e)s à · ' + cname[v[0].iso], city)}<div class="dbody">${originBody(v)}<a class="cta" href="Mosaique.dc.html?cat=joueurs">Voir Nos Lions →</a></div>`);
    if (fly) map.flyTo(v[0].ll, Math.max(map.getZoom(), 8), { duration: reduce ? 0 : 1 });
  }
  function openCountry(iso) {
    const v = ppl.filter(p => p.iso === iso); if (!v.length) return;
    openDrawer(`${head('Nos Lions · par pays', cname[iso])}<div class="dbody">${originBody(v)}<a class="cta" href="Mosaique.dc.html?cat=joueurs">Voir Nos Lions →</a></div>`);
    const f = land.features.find(x => x.id === iso); if (f) map.flyToBounds(L.geoJSON(f).getBounds(), { ...flyPad, maxZoom: 6, duration: reduce ? 0 : 1 });
  }

  // ===== TAB · ÉPOPÉES =====
  let routes = [];
  const curve = (a, b) => { const pts = []; const dx = b[1] - a[1], dy = b[0] - a[0]; const c = [(a[0] + b[0]) / 2 + dx * .22, (a[1] + b[1]) / 2 - dy * .22]; for (let t = 0; t <= 1.0001; t += .04) pts.push([(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]]); return pts; };
  const visSteps = () => steps.map((s, i) => ({ ...s, i })).filter(s => (S.etype === 'Toutes' || s.type === S.etype) && (S.eseason === 'Toutes' || s.s === S.eseason));
  function tabEpopees() {
    const seasonsE = [...new Set(steps.map(s => s.s))];
    panel.innerHTML = `<div class="phead"><span class="eyebrow">Carto · Les épopées</span><h1 class="ptitle">Les grandes<br>routes du Lion</h1><p class="pintro">Finales et nuits européennes, reliées à Montbéliard. Choisissez une étape ou lancez le récit.</p></div>
    <div class="filters">${chipRow('fEType', 'Compétition', ['Toutes', "Coupes d'Europe", 'Finales nationales'], S.etype)}${chipRow('fESeason', 'Saison', ['Toutes', ...seasonsE], S.eseason)}<button class="cta" id="playStory" data-play="▶ Lancer le récit">▶ Lancer le récit</button></div>
    <div class="steps" id="steps"></div>`;
    bindChips('fEType', 'etype', updEpopees); bindChips('fESeason', 'eseason', updEpopees);
    panel.querySelector('#playStory').onclick = () => { if (S.timer) return stopTimer(); const vs = visSteps(); if (!vs.length) return; let k = 0; goStep(vs[0].i); panel.querySelector('#playStory').textContent = '❚❚ Pause'; S.timer = setInterval(() => { k++; if (k >= vs.length) return stopTimer(); goStep(vs[k].i); }, 4200); };
    legend.innerHTML = `<span class="d">Légende</span><div class="lg"><span class="sw" style="background:${C.blue}"></span>Montbéliard</div><div class="lg"><span class="sw" style="background:${C.yellow}"></span>Trophée remporté</div><div class="lg"><span class="sw" style="background:${C.paper}"></span>Étape</div>`;
    home = () => map.flyToBounds(L.latLngBounds([HOME, ...steps.map(s => s.ll)]), { padding: [70, 70], duration: reduce ? 0 : 1 });
    map.fitBounds(L.latLngBounds([HOME, ...steps.map(s => s.ll)]), { padding: [70, 70] });
    L.circleMarker(HOME, { radius: 11, color: C.navy, weight: 2, fillColor: C.blue, fillOpacity: 1 }).bindTooltip('Montbéliard', { permanent: true, className: 'lbl', direction: 'right', offset: [10, 0] }).addTo(layer);
    updEpopees();
  }
  function updEpopees() {
    const vs = visSteps(); routes.forEach(r => layer.removeLayer(r.line).removeLayer(r.dot)); routes = [];
    vs.forEach(s => {
      const line = L.polyline(curve(HOME, s.ll), { color: C.blue, weight: 2, opacity: .5, dashArray: '4 7', className: 'route' }).addTo(layer);
      const dot = L.circleMarker(s.ll, { radius: 9, color: C.navy, weight: 2, fillColor: s.win ? C.yellow : C.paper, fillOpacity: 1 }).addTo(layer).bindTooltip(`<b>${s.y} · ${s.t}</b>${s.h}`, { className: 'tt', direction: 'top', offset: [0, -8] });
      dot.on('click', () => { stopTimer(); goStep(s.i); });
      routes.push({ i: s.i, line, dot });
    });
    panel.querySelector('#steps').innerHTML = vs.map(s => `<button class="step${S.step === s.i ? ' on' : ''}" data-i="${s.i}"><span class="n">${s.y}</span><span><span class="rname">${s.t}</span><br><span class="rmeta">${s.h} · ${s.s}${s.win ? ' · trophée ★' : ''}</span></span></button>`).join('') || '<p class="pintro" style="padding:16px">Aucune étape pour ces filtres.</p>';
    panel.querySelectorAll('.step').forEach(b => b.onclick = () => { stopTimer(); goStep(+b.dataset.i); });
  }
  function goStep(i) {
    S.step = i; const s = steps[i];
    panel.querySelectorAll('.step').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    routes.forEach(r => { const on = r.i === i; r.line.setStyle({ color: on ? C.yellow : C.blue, weight: on ? 6 : 2, opacity: on ? 1 : .35, dashArray: on ? null : '4 7' }); if (on) { r.line.bringToFront(); r.dot.bringToFront(); } });
    const r = routes.find(x => x.i === i); const el = r?.line.getElement();
    if (el && !reduce) { const Lg = el.getTotalLength(); el.style.transition = 'none'; el.style.strokeDasharray = Lg; el.style.strokeDashoffset = Lg; el.getBoundingClientRect(); el.style.transition = 'stroke-dashoffset 1.4s cubic-bezier(.6,0,.3,1)'; el.style.strokeDashoffset = 0; setTimeout(() => { el.style.strokeDasharray = ''; el.style.transition = ''; }, 1500); }
    map.flyToBounds(L.latLngBounds([HOME, s.ll]), { paddingTopLeft: [60, 60], paddingBottomRight: [60, 190], maxZoom: 9, duration: reduce ? 0 : 1.2 });
    story.innerHTML = `<span class="yr">${s.y}</span><div><h3>${s.t} · ${s.h}${s.win ? ' ★' : ''}</h3><p>${s.p}</p></div><div class="snav"><button data-d="-1" aria-label="Précédent">←</button><button data-d="1" aria-label="Suivant">→</button></div>`;
    story.classList.remove('show'); void story.offsetWidth; story.classList.add('show');
    story.querySelectorAll('button').forEach(bt => bt.onclick = () => { stopTimer(); const vs = visSteps(); const k = vs.findIndex(x => x.i === S.step); const n = vs[(k + +bt.dataset.d + vs.length) % vs.length]; if (n) goStep(n.i); });
  }

  // ===== TAB · LIEUX =====
  const lmk = [];
  function tabLieux() {
    panel.innerHTML = `<div class="phead"><span class="eyebrow">Carto · Les lieux du club</span><h1 class="ptitle">Le pays<br>du Lion</h1><p class="pintro">Bonal, la formation, le patrimoine Peugeot et les lieux des supporters, rue par rue.</p></div>
    <div class="filters">${chipRow('fLT', 'Type de lieu', ['Tous', ...Object.keys(LT)], S.ltype)}</div>
    <div class="listhead"><span id="lcount"></span><span style="color:var(--muted)">lieux</span></div><div class="list" id="list"></div>`;
    bindChips('fLT', 'ltype', updLieux);
    legend.innerHTML = `<span class="d">Types de lieux</span>${Object.entries(LT).map(([k, [g, c]]) => `<div class="lg"><span class="sw" style="background:${c}"></span>${k}</div>`).join('')}<div class="lg"><span class="sw" style="border-style:dashed"></span>Position indicative</div>`;
    home = () => map.flyTo([47.5095, 6.815], 14, { duration: reduce ? 0 : 1 });
    map.setView([47.5095, 6.815], 14);
    lieux.forEach((l, i) => {
      const [g, c] = LT[l.t]; const fg = c === C.navy || c === C.blue ? C.cream : C.navy;
      const icon = L.divIcon({ className: '', html: `<div class="pin${l.real ? '' : ' ind'}" style="background:${c};color:${fg}"><span>${g}</span></div>`, iconSize: [34, 34], iconAnchor: [17, 34] });
      const m = L.marker(l.ll, { icon }).addTo(layer).bindTooltip(`<b>${l.n}</b>${l.t}`, { className: 'tt', direction: 'top', offset: [0, -34] });
      m.on('click', () => openLieu(i)); lmk[i] = m;
    });
    updLieux();
  }
  function updLieux() {
    const vis = lieux.map((l, i) => ({ l, i })).filter(({ l }) => S.ltype === 'Tous' || l.t === S.ltype);
    lieux.forEach((l, i) => { const show = vis.some(v => v.i === i); const el = lmk[i].getElement(); if (el) { el.style.opacity = show ? 1 : 0; el.style.pointerEvents = show ? 'auto' : 'none'; el.style.transition = 'opacity .3s'; } });
    panel.querySelector('#lcount').textContent = vis.length + ' lieu' + (vis.length > 1 ? 'x' : '');
    const list = panel.querySelector('#list');
    list.innerHTML = vis.map(({ l, i }, k) => `<button class="row" data-i="${i}"><span class="rank">${LT[l.t][0]}</span><span><span class="rname">${l.n}</span><br><span class="rmeta">${l.t}${l.real ? '' : ' · position indicative'}</span></span><span class="rnum">→</span></button>`).join('');
    list.querySelectorAll('.row').forEach(r => { const i = +r.dataset.i; r.onclick = () => openLieu(i); r.onmouseenter = () => { const e = lmk[i].getElement(); if (e) e.firstChild.style.transform = 'rotate(-45deg) scale(1.25)'; }; r.onmouseleave = () => { const e = lmk[i].getElement(); if (e) e.firstChild.style.transform = ''; }; });
  }
  function openLieu(i) {
    const l = lieux[i];
    openDrawer(`${head(l.t, l.n)}<div class="dbody"><p class="pintro" style="font-size:18px;color:var(--navy)">${l.d}</p>${l.real ? '' : '<span class="note">Position indicative, à confirmer.</span>'}<a class="cta" href="Mosaique.dc.html?cat=${l.t === 'Supporters' ? 'supporters' : 'infra'}">Voir dans le musée →</a></div>`);
    map.flyTo(l.ll, 16, { duration: reduce ? 0 : 1 });
  }

  // ===== ROUTER =====
  function render() {
    stopTimer(); closeDrawer(); story.classList.remove('show'); S.step = -1; map.off('zoomend', onZoomLions); layer.clearLayers(); routes = [];
    ({ matchs: tabMatchs, lions: tabLions, epopees: tabEpopees, lieux: tabLieux })[S.tab]();
  }
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t => t.onclick = () => { S.tab = t.dataset.tab; tabs.forEach(x => x.setAttribute('aria-selected', x === t)); try { history.replaceState(null, '', '?vue=' + S.tab); } catch (e) {} render(); });
  const v = new URLSearchParams(location.search).get('vue'); if (['matchs', 'lions', 'epopees', 'lieux'].includes(v)) { S.tab = v; tabs.forEach(x => x.setAttribute('aria-selected', x.dataset.tab === v)); }
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('wrap'));
  render();
})();
</script>
</body>
</html>
