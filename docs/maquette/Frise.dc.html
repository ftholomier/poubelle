<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>body{margin:0;background:#F3EDDF;color:#0E1F4D;font-family:'Newsreader',Georgia,serif;-webkit-font-smoothing:antialiased}a{color:#0E1F4D;text-decoration:none}a:hover{color:#1F3FA8}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh;background:#F3EDDF">
<dc-import name="Header" active="Interactif" hint-size="100%,90px"></dc-import>
<section style="max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(16px,4vw,48px) 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:12px;flex:1 1 480px;min-width:0">
<span style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:#1F3FA8">La frise</span>
<h1 style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(56px,8vw,120px);line-height:.92;text-transform:uppercase;flex-shrink:0">1928 → <span style="color:#1F3FA8">aujourd'hui</span></h1>
<p style="margin:0;font-size:20px;color:#3A4A75">Faites glisser la frise, ou utilisez les flèches.</p>
</div>
<div style="display:flex;gap:10px">
<button onClick="{{ prev }}" aria-label="Précédent" style="all:unset;cursor:pointer;width:56px;height:56px;border:2px solid #0E1F4D;display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:26px" style-hover="background:#0E1F4D;color:#F6C400">←</button>
<button onClick="{{ next }}" aria-label="Suivant" style="all:unset;cursor:pointer;width:56px;height:56px;border:2px solid #0E1F4D;background:#0E1F4D;color:#F6C400;display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:26px" style-hover="background:#1F3FA8">→</button>
</div>
</section>

<div style="max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,48px)">
<div style="display:flex;gap:4px">
<sc-for list="{{ decades }}" as="d" hint-placeholder-count="11">
<button onClick="{{ d.go }}" style="all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;gap:6px" style-hover="color:#1F3FA8">
<span style="height:6px;background:{{ d.bar }};transition:background .3s"></span>
<span style="font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px">{{ d.label }}</span>
</button>
</sc-for>
</div>
</div>

<div ref="{{ trackRef }}" onScroll="{{ onScroll }}" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerLeave="{{ up }}" style="overflow-x:auto;cursor:grab;user-select:none;padding:40px 0 56px;scrollbar-width:none">
<div style="position:relative;display:flex;gap:0;width:max-content;padding:0 clamp(16px,4vw,48px) 0 max(clamp(16px,4vw,48px),calc((100vw - 1320px) / 2 + 48px))">
<div style="position:absolute;left:0;right:0;top:50%;height:4px;background:#0E1F4D"></div>
<sc-for list="{{ events }}" as="e" hint-placeholder-count="6">
<div style="position:relative;width:340px;height:640px;flex-shrink:0;display:flex;flex-direction:column;justify-content:{{ e.justify }};padding:0 14px">
<div style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:{{ e.dot }};border:4px solid #0E1F4D;z-index:2"></div>
<div style="position:absolute;left:26px;top:{{ e.stemTop }};height:46px;width:4px;background:#0E1F4D"></div>
<div style="height:274px;display:flex;flex-direction:column;border:2px solid #0E1F4D;background:{{ e.bg }};color:{{ e.fg }};transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s" style-hover="transform:translateY(-6px);box-shadow:8px 8px 0 #1F3FA8">
<div style="height:130px;border-bottom:2px solid #0E1F4D;background:#E8DFC9;flex-shrink:0"><image-slot id="{{ e.id }}" shape="rect" placeholder="Archive {{ e.y }}"></image-slot></div>
<div style="padding:14px 16px;display:flex;flex-direction:column;gap:6px">
<span style="font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:44px;line-height:1">{{ e.y }}</span>
<span style="font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.1">{{ e.t }}</span>
</div>
</div>
</div>
</sc-for>
</div>
</div>
<dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { p: 0 };
  trackRef = React.createRef();
  ev = [
    [1928, 'Fondation du club'], [1935, 'Premier titre de champion de France', 'y'], [1937, 'Coupe de France', 'y'], [1938, 'Second titre de champion', 'y'],
    [1955, 'Coupe Gambardella'], [1963, 'Coupe Gambardella'], [1964, 'Coupe Gambardella'], [1981, 'Demi-finale de Coupe UEFA', 'y'],
    [1983, 'Coupe Gambardella'], [1988, 'Finale de Coupe de France'], [2004, 'Coupe de la Ligue', 'y'], [2007, 'Coupe de France', 'y'],
    [2007, 'Coupe Gambardella'], [2028, 'Centenaire du club', 'n'],
  ];
  scrollBy(d) { this.trackRef.current?.scrollBy({ left: d * 680, behavior: 'smooth' }); }
  goDecade(dec) { const el = this.trackRef.current; if (!el) return; const i = this.ev.findIndex(e => e[0] >= dec); el.scrollTo({ left: Math.max(0, i) * 340, behavior: 'smooth' }); }
  renderVals() {
    const decs = [1920, 1930, 1940, 1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020];
    const curYear = this.ev[Math.min(this.ev.length - 1, Math.round(this.state.p * (this.ev.length - 1)))][0];
    return {
      prev: () => this.scrollBy(-1), next: () => this.scrollBy(1),
      onScroll: e => { const el = e.currentTarget; const max = el.scrollWidth - el.clientWidth; this.setState({ p: max > 0 ? el.scrollLeft / max : 0 }); },
      down: e => { this.drag = { x: e.clientX, s: this.trackRef.current.scrollLeft }; e.currentTarget.style.cursor = 'grabbing'; },
      move: e => { if (!this.drag) return; this.trackRef.current.scrollLeft = this.drag.s - (e.clientX - this.drag.x); },
      up: e => { this.drag = null; e.currentTarget.style.cursor = 'grab'; },
      decades: decs.map(d => ({ label: d < 2000 ? "'" + String(d).slice(2) : String(d), bar: curYear >= d ? '#F6C400' : '#E8DFC9', go: () => this.goDecade(d) })),
      events: this.ev.map(([y, t, k], i) => {
        const top = i % 2 === 0;
        return { y, t, id: 'frise-' + i, justify: top ? 'flex-start' : 'flex-end', stemTop: top ? '274px' : '320px',
          bg: k === 'y' ? '#F6C400' : k === 'n' ? '#0E1F4D' : '#FFFDF6', fg: k === 'n' ? '#F6C400' : '#0E1F4D', dot: k === 'y' ? '#F6C400' : '#F3EDDF' };
      }),
    };
  }
}
</script>
</body>
</html>
