# Exemple de configuration Nginx + PHP-FPM (PHP 8.2 ou plus)
# Le domaine pointe sur le dossier public/ : le code, les données et la configuration restent inaccessibles.

server {
    listen 80;
    listen [::]:80;
    server_name animateurpourvotresoiree.com www.animateurpourvotresoiree.com;
    return 301 https://www.animateurpourvotresoiree.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name animateurpourvotresoiree.com;
    # ssl_certificate / ssl_certificate_key …
    return 301 https://www.animateurpourvotresoiree.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.animateurpourvotresoiree.com;
    # ssl_certificate /etc/letsencrypt/live/www.animateurpourvotresoiree.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.animateurpourvotresoiree.com/privkey.pem;

    root /var/www/animateurpourvotresoiree/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain application/xml;

    # fichiers cachés
    location ~ /\. { deny all; }

    # ressources versionnées
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # médias envoyés : jamais exécutés
    location ^~ /media/ {
        location ~* \.(php\d?|phtml|phar|html?|svg)$ { deny all; }
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;
    }

    # aucun autre script PHP n'est accessible
    location ~ \.php$ { return 404; }
}
